<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuesto de Obra</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="css/main.css" rel="stylesheet">
</head>
<body>

<header class="no-print" style="display:flex">
  <!-- repeated inside print header below -->
</header>

<!-- PRINT-ONLY top bar inside card -->
<div class="page">
  <div class="card">

    <!-- top bar visible always -->
    <div style="background:#2ecc8e; padding:14px 28px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:'DM Serif Display',serif; color:#fff; font-size:1.4rem;">Presupuesto: </span>
    </div>

    <!-- INFO -->
    <div class="two-col">
      <div class="info-block">
        <div class="block-title">Datos Empresa</div>
        <div class="static-row"><span class="lbl">Nombre:</span><span class="val" id="e-nombre"></span></div>
        <div class="static-row"><span class="lbl">Dirección:</span><span class="val" id="e-dir"></span></div>
        <div class="static-row"><span class="lbl">Teléfono:</span><span class="val" id="e-tel"></span></div>        
        <div class="static-row"><span class="lbl">Mail:</span><span class="val" id="e-mail"></span></div>
      </div>
      <div class="info-block">
        <div class="block-title">Datos Cliente</div>
        <div class="field"><label>Nombre:</label><input id="c-nombre" type="text" placeholder="Nombre del cliente"></div>
        <div class="field"><label>Dirección:</label><input id="c-dir"    type="text" placeholder="Dirección"></div>
        <div class="field"><label>Teléfono:</label><input id="c-tel"    type="text" placeholder="Teléfono"></div>
      </div>
    </div>

    <!-- META -->
    <div class="meta-row">
      <div class="meta-item"><label>Fecha:</label><span class="val" id="fecha-hoy"></span></div>
      <div class="meta-item"><label>Validez:</label><input id="validez" type="text" placeholder="Ej: 30 días"></div>
    </div>

    <!-- PRODUCTS -->
    <div class="products-toolbar">
      <button class="btn-add no-print" onclick="addRow()">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Agregar ítem
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:44%">Descripción</th>
            <th class="c" style="width:12%">Cant.</th>
            <th class="r" style="width:18%">Precio unit.</th>
            <th class="r" style="width:18%">Total</th>
            <th class="c no-print" style="width:8%"></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>

    <!-- TOTALS -->
    <div class="totals-row">
      <div class="totals-box">
        <div class="grand-line">
          <span>TOTAL</span>
          <span class="amount" id="total-display">$ 0,00</span>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions no-print">
      <button class="btn-pdf" onclick="descargarPDF()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3m0 12-4-4m4 4 4-4"/><rect x="2" y="17" width="20" height="4" rx="1"/>
        </svg>
        Descargar Presupuesto PDF
      </button>
      <span class="status-msg" id="status-msg"></span>
    </div>

  </div>
</div>

<script>
/* ═══════════════════════════════════════
   VARIABLES — editá aquí
   ═══════════════════════════════════════ */
const EMPRESA = {
  nombre:    "Viedreria S&A",
  direccion: "Huemul 5020",
  telefono:  "+541124741519",
  mail:  "vidrieriarafa@gmail.com"

};

const ITEMS_INICIALES = [

];
/* ═══════════════════════════════════════ */

const fmt = n =>
  "$ " + Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});

let rowId = 0;

function init() {
  document.getElementById("e-nombre").textContent = EMPRESA.nombre;
  document.getElementById("e-dir").textContent    = EMPRESA.direccion;
  document.getElementById("e-tel").textContent    = EMPRESA.telefono;
  document.getElementById("e-mail").textContent    = EMPRESA.mail;
  const hoy = new Date();
  document.getElementById("fecha-hoy").textContent =
    `${String(hoy.getDate()).padStart(2,"0")}-${String(hoy.getMonth()+1).padStart(2,"0")}-${hoy.getFullYear()}`;
  ITEMS_INICIALES.forEach(i => addRow(i.descripcion, i.cantidad, i.precio));
}

function addRow(desc="", qty=1, precio="") {
  const id = ++rowId;
  const tr = document.createElement("tr");
  tr.id = "row-"+id;

  const total = (parseFloat(qty)||0) * (parseFloat(precio)||0);

  tr.innerHTML = `
    <td class="td-desc" data-val="${String(desc).replace(/"/g,"&quot;")}">
      <input type="text" placeholder="Descripción del ítem"
             value="${String(desc).replace(/"/g,"&quot;")}"
             oninput="syncAttr(this,'td-desc');recalc()" data-f="desc">
    </td>
    <td class="td-qty" data-val="${qty}">
      <input type="number" placeholder="1"
             value="${qty}" min="0" step="1"
             oninput="syncAttr(this,'td-qty');recalc()" data-f="qty">
    </td>
    <td class="td-price" data-val="${precio!=='' ? fmt(precio) : fmt(0)}">
      <input type="number" placeholder="0.00"
             value="${precio!=='' ? precio : ''}" min="0" step="0.01"
             oninput="syncAttr(this,'td-price',true);recalc()" data-f="price">
    </td>
    <td class="td-total" id="tot-${id}">${fmt(total)}</td>
    <td class="td-action no-print">
      <button class="btn-del" onclick="delRow(${id})" title="Eliminar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </td>`;
  document.getElementById("items-body").appendChild(tr);
  recalc();
}

function syncAttr(input, cls, isPrice=false) {
  const td = input.closest("td");
  td.setAttribute("data-val", isPrice ? fmt(parseFloat(input.value)||0) : input.value);
}

function delRow(id) {
  const tr = document.getElementById("row-"+id);
  if (tr) { tr.remove(); recalc(); }
}

function recalc() {
  let total = 0;
  document.querySelectorAll("#items-body tr").forEach(tr => {
    const qty   = parseFloat(tr.querySelector('[data-f="qty"]')?.value)   || 0;
    const price = parseFloat(tr.querySelector('[data-f="price"]')?.value) || 0;
    const sub   = qty * price;
    total += sub;
    const cell = tr.querySelector('[id^="tot-"]');
    if (cell) cell.textContent = fmt(sub);
  });
  document.getElementById("total-display").textContent = fmt(total);
}

function descargarPDF() {
  const msg = document.getElementById("status-msg");
  msg.textContent = "Abriendo diálogo de impresión...";
  setTimeout(() => {
    window.print();
    msg.textContent = "✅ Usá 'Guardar como PDF' en el diálogo de impresión.";
    setTimeout(() => { msg.textContent = ""; }, 6000);
  }, 100);
}

init();
</script>
</body>
</html>
